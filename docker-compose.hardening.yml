version: '3.3'

services:
  app:
    networks:
      - default
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    networks:
      - database

  phpmyadmin:
    networks:
      - default
      - database

  mysql-exporter:
    networks:
      - default
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  database:
    internal: true
