version: '3.3'

services:
  loki:
    image: grafana/loki:3.7.0
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - club_loki_data:/loki
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.5.0
    user: "0:0"
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/volumes/nginxproxymanager_npm_data/_data/logs:/var/log/npm:ro
      - club_promtail_positions:/positions
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  club_loki_data:
  club_promtail_positions:
