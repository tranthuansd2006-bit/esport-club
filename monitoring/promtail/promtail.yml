server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx-esport
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_access
          app: esport-club
          host: esport.test
          __path__: /var/log/npm/proxy-host-3_access.log

    pipeline_stages:
      - regex:
          expression: '^\[(?P<time>[^\]]+)\] - \S+ (?P<status>[0-9]{3}) - (?P<method>\S+) '
      - timestamp:
          source: time
          format: '02/Jan/2006:15:04:05 -0700'
          action_on_failure: skip
      - labels:
          status:
          method:
